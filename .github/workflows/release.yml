name: Release

# Builds what a release hands out and leaves it on GitHub as a draft: the
# disk image with the signed and notarised app, a file with its SHA-256,
# the notices of the software in it, and what the release before needs to
# update itself to this one. RELEASING.md says what comes before and after.
#
# It is started by hand, from the Actions page or with `gh workflow run`,
# and builds main and nothing else. Nothing becomes public here: a person
# tries what was built, and then publishes the draft.
#
# The work is done on two machines. The first builds the programs from the
# source, which runs code from everything the app is made of, and is given
# no secret. The second is given the secrets: the Developer ID certificate
# the app is signed with, the key that asks Apple to notarise it, and the
# key that updates are signed with. It builds nothing and starts none of
# the programs the first one built: it takes them as files, puts the app
# together, signs it and packs it. A package the app depends on can
# therefore not read a secret while a release is built.
#
# This is the one workflow that is given secrets. They are kept in the
# environment "release", which GitHub hands to runs from main only, and
# here to the second job only.

on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: Only try the build. Its files stay with the run for a day, and no release is drafted.
        type: boolean
        default: false

# What a run may do is said where it does it.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.ref == 'refs/heads/main'
    # Apple silicon, which is all the app is built for.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      # To read the commit, and the releases that are out.
      contents: read
      # To see that the commit has passed its checks.
      checks: read
    steps:
      # Actions are named by commit, so that a moved tag cannot change what
      # runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The commit has passed its checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "Format, lints, tests and build")][0].conclusion // "not there"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::The checks of this commit have not passed ($conclusion). A release is built from a commit that passed them."
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Before anything is built: a version that is out is never built a
      # second time.
      - name: This version is not out yet
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./app/package.json").version')
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "::error::Release v$version is published already. A fix gets the next version."
            exit 1
          fi

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Nothing comes out of a cache here: what is built is what the commit
      # and its lock files name.
      - name: What the window is built from
        run: npm --prefix app ci

      # The programs and the notices. Whatever runs here, there is no
      # secret on this machine for it to find.
      - name: Build
        run: scripts/release.sh --build

      - name: Hand over what was built
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built
          path: target/release-built
          # The second job has a day to start, which matters where a
          # person has to let it: after that, the run is started anew.
          retention-days: 1
          if-no-files-found: error
          # A run that is started once more hands over what it built then.
          overwrite: true

  finish:
    name: Sign, notarise and draft
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      # To read the commit, and to draft the release and attach its files.
      contents: write
    steps:
      # The same commit the first job built: a run has one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Of everything the app is built from, the bundler alone comes to
      # this machine: the Tauri CLI and the program for this kind of Mac
      # that belongs to it, fetched as the app's lock file names them and
      # held against its checksums. Nothing else is installed, so no
      # package can stand in for the bundler, or for a command the bundler
      # starts. The bundler asks cargo how the workspace is laid out, and
      # that is all Rust is for here: the one that comes with the machine
      # will do, and nothing is compiled.
      - name: The bundler, and nothing else
        run: |
          cargo --version
          bundler=$(node scripts/bundler-alone.mjs "$RUNNER_TEMP/bundler")
          echo "YCA_BUNDLER=$bundler" >>"$GITHUB_ENV"

      # The app's program, the `yca` command, the notices, and a note of
      # the commit they were built from. The script takes them by name and
      # starts none of them.
      - name: What was built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built
          path: target/release-built

      - name: Signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "::error::The environment 'release' lacks APPLE_CERTIFICATE or APPLE_CERTIFICATE_PASSWORD. See RELEASING.md."
            exit 1
          fi

          # A keychain of this run's own. Nobody needs to know its password:
          # it lasts as long as the run.
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(openssl rand -hex 24)
          certificate="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode >"$certificate"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The key can sign from here, through codesign and nothing else,
          # and cannot be taken out of the keychain again.
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 \
            -k "$keychain" -x -T /usr/bin/codesign
          rm -f "$certificate"
          # Lets codesign use the key without the dialog nobody is here to
          # answer.
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" >/dev/null
          # Searched first, before the keychains that were there already.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity() {
            security find-identity -v -p codesigning "$keychain" |
              sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1
          }
          signer=$(identity)
          if [ -z "$signer" ]; then
            # The certificate is there but does not count: this machine
            # lacks the certificate of Apple's authority that issued it.
            curl -fsS -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
              https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
            signer=$(identity)
          fi
          if [ -z "$signer" ]; then
            echo "::error::APPLE_CERTIFICATE holds no valid Developer ID Application certificate with its key."
            exit 1
          fi

          # Every copy of the app names who signed it, so none of this is a
          # secret. It still has no place in a log that anybody can read.
          holder=$(printf '%s' "$signer" | sed -n 's/^Developer ID Application: \(.*\) ([A-Z0-9]*)$/\1/p')
          team=$(printf '%s' "$signer" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')
          for hidden in "$signer" "$holder" "$team"; do
            [ -z "$hidden" ] || echo "::add-mask::$hidden"
          done
          echo "APPLE_SIGNING_IDENTITY=$signer" >>"$GITHUB_ENV"

      - name: Notarisation key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::error::The environment 'release' lacks APPLE_API_KEY_P8. See RELEASING.md."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" >"$key")
          echo "APPLE_API_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Sign, notarise and pack
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # The key that the archive an installed app updates itself from
          # is signed with. The script refuses to go on without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The window of the disk image is laid out as it is on a Mac with
          # somebody at it, which the bundler leaves out when it runs
          # unattended.
          TAURI_BUNDLER_DMG_IGNORE_CI: true
        run: scripts/release.sh --finish

      - name: Keep the files of a rehearsal
        if: inputs.rehearsal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal
          path: |
            target/release-files
            target/release-parts/release-notes.md
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Draft the release
        if: ${{ !inputs.rehearsal }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p 'require("./app/package.json").version')
          # A draft that an earlier run left is replaced by this one.
          if [ "$(gh release view "v$version" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "v$version" --yes
          fi
          # No tag is made yet. Publishing the draft makes one on this
          # commit, unless a tag of that name was pushed before.
          gh release create "v$version" --draft --target "$GITHUB_SHA" \
            --title "CA for YubiKey $version" \
            --notes-file target/release-parts/release-notes.md \
            target/release-files/*

      - name: Leave no key behind
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
